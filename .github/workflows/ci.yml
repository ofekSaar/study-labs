name: CI

# Runs on every PR targeting main, on direct pushes to main, and can be
# triggered manually from the Actions tab.
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Frontend — lint, test, build
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      CI: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Node 24: Babel transforms the test suite to CJS, but dependencies such as
      # zustand and framer-motion are published as ESM. Node 24 supports
      # require(ESM) natively, so jest.mock() works without --experimental-vm-modules
      # (that flag broke jest.mock() for ESM imports in our setup).
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          # Key the npm cache to the frontend lockfile so backend installs
          # do not pollute and vice-versa.
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # ESLint — fail fast before running the slower build/test steps.
      - name: Lint
        run: npm run lint

      # Jest with jsdom (--experimental-vm-modules already baked into the
      # npm test script in frontend/package.json).
      - name: Test
        run: npm test

      # Vite production build — catches type/import errors that tests miss.
      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Job 2: Backend — test only (no server required)
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (test)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      CI: true
      NODE_ENV: test
      # JWT_SECRET is read by server.js at module load time — before the
      # beforeAll() in tests can set process.env.JWT_SECRET. Providing a
      # dummy value here prevents a crash on import. Tests override it
      # themselves (see backend/tests/auth.test.js line 9).
      JWT_SECRET: ci-dummy-secret-not-used-in-prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Jest with mongodb-memory-server — spins up an in-process MongoDB
      # instance, so NO external database service container is needed.
      # cross-env and --forceExit/--detectOpenHandles are baked into the
      # npm test script in backend/package.json.
      - name: Test
        run: npm test

  # ---------------------------------------------------------------------------
  # Job 3: AI Engine — unit tests + real LLM integration tests
  #
  # Unit tests use mocked SBERT vectors (no downloads needed).
  # Integration tests use real OpenAI API calls to verify:
  #   - Syllabus validation rejects non-syllabus documents
  #   - Syllabus validation accepts real syllabi
  #   - Unrelated materials → all topics ungrounded
  # Integration tests auto-skip if OPENAI_API_KEY is not set.
  # ---------------------------------------------------------------------------
  ai-engine:
    name: AI Engine (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-engine
    env:
      CI: true
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TOPIC_MATERIAL_THRESHOLD: ${{ vars.TOPIC_MATERIAL_THRESHOLD || '0.225' }}
      MIN_SUMMARY_WORDS: 500
      SUMMARY_COHERENCE_THRESHOLD: '0.45'
      SUMMARY_GROUNDING_THRESHOLD: '0.35'
      KEYWORD_COVERAGE_THRESHOLD: '0.60'
      QUESTION_ALIGNMENT_THRESHOLD: '0.35'
      MAX_QUALITY_RETRIES: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-heb tesseract-ocr-eng
      - name: Install dependencies
        run: pip install -r requirements.txt && pip install pytest pytest-asyncio httpx
      - name: Run tests
        run: pytest tests/ -v --tb=short
