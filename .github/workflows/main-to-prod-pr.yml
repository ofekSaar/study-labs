name: Auto PR — main to production

# Fires only after the CI workflow completes successfully on main.
# This prevents a production PR from opening when tests are failing.
on:
  workflow_run:
    workflows: ["CI"]
    branches: ["main"]
    types: [completed]

# GITHUB_TOKEN needs pull-requests: write to open PRs.
# contents: read is needed by checkout; pull-requests: write by gh pr create.
permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    # Skip if CI did not pass
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + all remote refs so git rev-list can compare
          # origin/production..origin/main without "unknown revision" errors.
          fetch-depth: 0

      - name: Open PR to production
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if main has commits ahead of production
          AHEAD=$(git rev-list origin/production..origin/main --count 2>/dev/null || echo "0")
          if [ "$AHEAD" = "0" ]; then
            echo "main is not ahead of production — nothing to merge."
            exit 0
          fi
          # Check if a PR already exists
          EXISTING=$(gh pr list --base production --head main --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already open — skipping creation."
            exit 0
          fi
          TIMESTAMP=$(date +'%Y-%m-%d %H:%M')
          gh pr create \
            --base production \
            --head main \
            --title "chore: release main → production ($TIMESTAMP)" \
            --body "Automated PR created after push to main on $TIMESTAMP. Review and merge to trigger deployment."
