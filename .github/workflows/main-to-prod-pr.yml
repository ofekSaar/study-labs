name: Auto PR — main to production

# Fires only after the CI workflow completes successfully on main.
# This prevents a production PR from opening when tests are failing.
on:
  workflow_run:
    workflows: ["CI"]
    branches: ["main"]
    types: [completed]

# GITHUB_TOKEN needs contents: write to push RC branch, pull-requests: write to open PRs.
permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    # Skip if CI did not pass
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + all remote refs so git rev-list can compare
          fetch-depth: 0

      - name: Create RC branch and open PR to production
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if main has commits ahead of production
          AHEAD=$(git rev-list origin/production..origin/main --count 2>/dev/null || echo "0")
          if [ "$AHEAD" = "0" ]; then
            echo "main is not ahead of production — nothing to merge."
            exit 0
          fi

          DATE=$(date +'%Y-%m-%d')
          RC_BRANCH="rc/$DATE"

          # Configure bot identity
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create/update RC branch locally from main and push to remote
          git checkout -B $RC_BRANCH main
          git push origin $RC_BRANCH --force

          # Check if an open PR for this RC branch already exists
          EXISTING=$(gh pr list --base production --head $RC_BRANCH --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING for $RC_BRANCH already open — branch updated."
            exit 0
          fi

          # Create PR from rc/YYYY-MM-DD to production
          gh pr create \
            --base production \
            --head $RC_BRANCH \
            --title "Release Candidate $RC_BRANCH → production" \
            --body "Automated Release Candidate PR for **$DATE**. Includes all tested changes pushed to \`main\` today. Review and merge to trigger production deployment."
