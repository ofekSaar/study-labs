services:
  # ── MongoDB ─────────────────────────────────
  mongo:
    image: mongo:7
    container_name: studylabs-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: studylabs
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Backend (Node.js + Express) ─────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studylabs-backend
    restart: unless-stopped
    ports:
      - "5001:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - shared_uploads:/app/uploads
    environment:
      PORT: 5000
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/studylabs
      JWT_SECRET: ${JWT_SECRET:-studylabs-dev-secret-change-in-prod}
      JWT_EXPIRES_IN: 7d
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: http://localhost:5001/api/auth/google/callback
      CLIENT_URL: http://localhost:5173
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-engine:8000}
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:-}
      STORAGE_TYPE: local
      UPLOAD_DIR: ./uploads
      MAX_FILE_SIZE: 52428800
      MAX_MATERIALS_COUNT: ${MAX_MATERIALS_COUNT:-20}
    depends_on:
      mongo:
        condition: service_healthy

  # ── Frontend (Vite + React) ─────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: studylabs-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:5001
    depends_on:
      - backend

  # ── AI Engine (FastAPI) ─────────────────────
  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: studylabs-ai-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./ai-engine:/app
      - shared_uploads:/app/uploads
    environment:
      MONGO_URI: mongodb://mongo:27017/
      MONGO_DB_NAME: studylabs_db
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPEN_ROUTE_API_KEY: ${OPEN_ROUTE_API_KEY:-}
      USE_MOCK_AI: ${USE_MOCK_AI:-False}
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
    driver: local
  shared_uploads:
    driver: local
