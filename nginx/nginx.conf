# System nginx config — place at /etc/nginx/sites-available/studylabs
# then: sudo ln -s /etc/nginx/sites-available/studylabs /etc/nginx/sites-enabled/studylabs
# then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name studylabs.cs.colman.ac.il;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name studylabs.cs.colman.ac.il;

    ssl_certificate     /etc/ssl/cs/studylabs.cs.colman.ac.il.crt;
    ssl_certificate_key /etc/ssl/cs/studylabs.cs.colman.ac.il.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 100M;

    # Frontend (Vite dev server / built app)
    location / {
        proxy_pass         http://localhost:5173;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend API
    location /api/ {
        proxy_pass         http://localhost:5001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
